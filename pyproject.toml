[project]
name = "aqstudio"
version = "0.2.0"
description = "Civic Air Quality Briefing Studio"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic==2.8.0",
    "defusedxml==0.7.1",
    "fastapi==0.162.7",
    "httpx==0.28.1",
    "itsdangerous==2.2.0",
    "jinja2==3.1.6",
    "openpyxl==3.1.5",
    "pandas==3.1.1",
    "pdfplumber==0.11.10",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "python-multipart==0.0.33",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aqstudio"]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pandas-stubs==3.1.0.261029",
    "pip-audit==2.10.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
    "types-openpyxl==3.1.5.20261017",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=aqstudio --cov-report=term-missing"
